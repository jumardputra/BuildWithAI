# Jalankan dari akar repositori:
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  buildwithai:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: buildwithai:1.1.0
    container_name: buildwithai
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DB_PATH: /data/buildwithai.db
      DIST_DIR: /app/dist
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
    volumes:
      - buildwithai-data:/data
    ports:
      # Hanya untuk localhost; nginx di host yang meneruskan ke sini.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  buildwithai-data:
