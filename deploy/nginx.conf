# BuildWithAI — reverse proxy nginx
# Simpan di /etc/nginx/sites-available/buildwithai lalu symlink ke sites-enabled.
# Ganti buildwithai.contoh.com dengan domain Anda.

upstream buildwithai_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name buildwithai.contoh.com;

    # Biarkan certbot menaruh berkas tantangannya
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name buildwithai.contoh.com;

    # Sertifikat diisi oleh certbot; jalur ini yang dipakai setelahnya.
    ssl_certificate     /etc/letsencrypt/live/buildwithai.contoh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buildwithai.contoh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Ukuran unggahan: hanya JSON kecil
    client_max_body_size 256k;

    # Aset ber-hash boleh di-cache lama
    location /assets/ {
        proxy_pass http://buildwithai_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Alamat bersih: /ruang-kerja -> /ruang-kerja/ (ditangani aplikasi,
    # yang menyajikan ruang-kerja/index.html). Tidak ada ekstensi di URL.
    location / {
        proxy_pass http://buildwithai_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    # Jangan biarkan nginx menangani 404 sendiri; aplikasi yang memutuskan
    # (supaya /ruang-kerja tanpa ekstensi tetap berfungsi).
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        return 503 "Server sedang sibuk. Coba lagi sebentar.";
    }
}
